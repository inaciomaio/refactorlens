[package]
name = "refactorlens"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Paste code, get a modern version, and learn why every change was made."
license = "MIT"
authors = ["Inácio Maio"]
readme = "README.md"
keywords = ["refactoring", "education", "llm", "code-review"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
